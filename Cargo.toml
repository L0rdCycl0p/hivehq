[package]
name = "hivehq"
version = "0.1.1"
edition = "2024"
description = "HIVE (Hive Is Very Efficient) — a lightweight native runtime inspired by BEAM, designed to run large numbers of small, isolated processes without a virtual machine."
license = "GPL-3.0-only"
include = [
    "README.md",
    "LICENSE",
    "src/**/*.rs",
    "src/**/*.asm",
    "build.rs",
    "flake.lock",
    "flake.nix",
]
repository = "https://github.com/L0rdCycl0p/hivehq"
readme = "README.md"

keywords = ["runtime", "linux", "memory", "server"]
authors = ["L0rdCycl0p"]
build = "build.rs"
categories = ["concurrency", "virtualization"]
[features]
default = ["x86_64"]
debug = []
x86_64 = []

[dependencies]
thiserror = "2"
libc = "0.2"
parking_lot = "0.12"
chrono = "0.4"
bitflags = "2"
binrw = "0.15"
clap = { version = "4.6", features = ["derive"] }
[profile.dbg]
inherits = "dev"

opt-level = 0
debug = 2
split-debuginfo = "off"
debug-assertions = true
overflow-checks = true
incremental = false
strip = "none"
panic = "unwind"
codegen-units = 1

[profile.dbg.package."*"]
opt-level = 0
debug = 2
split-debuginfo = "off"
strip = "none"

[profile.release]
opt-level = 3
debug = "none"
lto = "fat"
strip = true
overflow-checks = false
codegen-units = 1

[lib]
name = "hivehq"
path = "src/lib.rs"
[[bin]]
name = "hive"
path = "src/main.rs"
[lints.rust]
missing_docs = "warn"
[lints.rustdoc]
all = "warn"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
#restriction = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
unreachable = "deny"
unimplemented = "warn"
unchecked_time_subtraction = "warn"
todo = "warn"
string_slice = "warn"
panic_in_result_fn = "warn"
panic = "warn"
exit = "warn"
as_conversions = "allow"
big_endian_bytes = "deny"
cast_possible_truncation = "allow"
